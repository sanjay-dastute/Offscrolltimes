name: Encrypted D1 backup
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
jobs:
  backup-and-restore-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Export D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_BACKUP_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm wrangler d1 export ccorpinseconds-lifecycle --remote --output=offscroll-d1.sql
      - run: pnpm db:verify-backup offscroll-d1.sql
      - name: Encrypt and restoration-test
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          node scripts/encrypt-backup.mjs offscroll-d1.sql offscroll-d1.enc
          node scripts/verify-encrypted-backup.mjs offscroll-d1.enc
          rm offscroll-d1.sql
      - uses: actions/upload-artifact@v4
        with:
          name: offscroll-d1-${{ github.run_id }}
          path: offscroll-d1.enc
          retention-days: 30
          if-no-files-found: error
